<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Скрипт оператора П5 и П6</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="theme.css">
</head>
<body>
<header class="top">
  <div class="brand"><span>Скрипт оператора · бюджет<small><span class="zh">«Жемчужина»</span> · Поликлиники №5 и №6, Костанай</small></span></div>
  <div class="gs" role="search">
    <svg class="gs-ic" viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M13 13l4.5 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <input id="gsq" type="search" autocomplete="off" placeholder="Поиск: кабинет, врач, ВКК, флюорография…" aria-label="Поиск по скрипту" aria-controls="gsr" aria-expanded="false">
    <kbd class="gs-k" aria-hidden="true">/</kbd>
    <div id="gsr" class="gsr" role="listbox" hidden></div>
  </div>
  <span id="lineChip" class="chip">Линия не выбрана</span>
  <a class="btn" href="help.html" target="_blank" rel="noopener" title="Как пользоваться скриптом" aria-label="Как пользоваться скриптом" style="text-decoration:none;padding-left:14px;padding-right:14px">?</a>
  <button id="backBtn" class="btn" type="button">← Назад</button>
  <button id="newBtn" class="btn primary" type="button">Новый звонок</button>
</header>
<div class="wrap">
  <main>
    <nav id="trail" class="trail" aria-label="Пройденные шаги"></nav>
    <section id="card" class="card" aria-live="polite"></section>
  </main>
  <aside>
    <div class="tabs" role="tablist">
      <button type="button" role="tab" id="tab-doc" aria-selected="true">Врачи</button>
      <button type="button" role="tab" id="tab-odd" aria-selected="false">Нестандартное</button>
      <button type="button" role="tab" id="tab-memo" aria-selected="false">Памятка</button>
    </div>
    <div id="pane" class="pane"></div>
  </aside>
</div>

<script>
/* data.js грузим с меткой времени, чтобы браузер и GitHub не показывали старую версию скрипта после правок */
(function(){var v=Date.now();var d=document.createElement("script");d.src="data.js?v="+v;
d.onload=function(){var a=document.createElement("script");a.src="app.js?v="+v;document.body.appendChild(a);};
d.onerror=function(){document.getElementById("card").innerHTML="<p>Не удалось загрузить скрипт. Обновите страницу.</p>";};
document.body.appendChild(d);})();
</script>
</body>
</html>
