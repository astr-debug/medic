<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Как пользоваться скриптом П5 и П6</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="theme.css">
<style>
/* Руководство: оглавление слева, текст справа; на телефоне — одной колонкой. */
.top .brand{margin-right:auto}
.doc{display:grid;grid-template-columns:240px minmax(0,1fr);gap:28px;max-width:1100px;margin:0 auto;padding:24px 20px 60px}
@media (max-width:860px){.doc{grid-template-columns:1fr}}
.toc{position:sticky;top:90px;align-self:start;font-size:13.5px}
@media (max-width:860px){.toc{position:static}}
.toc p{font:700 12px var(--display);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:14px 0 6px}
.toc p:first-child{margin-top:0}
.toc a{display:block;padding:4px 10px;border-radius:8px;color:var(--ink);text-decoration:none}
.toc a:hover{background:var(--surface)}
article{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px 32px;max-width:760px}
@media (max-width:600px){article{padding:20px}}
article h2{font:800 24px/1.25 var(--display);margin:40px 0 6px;scroll-margin-top:90px;text-wrap:balance}
article h2:first-child{margin-top:0}
article h2 + .lead{color:var(--muted);margin:0 0 18px}
article h3{font:700 17px/1.3 var(--display);margin:28px 0 8px;scroll-margin-top:90px}
article p,article li{line-height:1.6;max-width:68ch}
article ol,article ul{padding-left:22px}
article li{margin-bottom:6px}
kbd{display:inline-block;font:600 12px var(--display);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 6px;background:var(--bg)}
.tip{border-left:4px solid var(--say-line);background:var(--say-bg);border-radius:10px;padding:10px 14px;margin:12px 0}
.warn{border-left:4px solid var(--note-line);background:var(--note-bg);border-radius:10px;padding:10px 14px;margin:12px 0}
.ui{font-weight:700}
.sample{display:inline-block;padding:0 6px;border-radius:5px;font-size:13px;font-weight:700}
.sample.g{background:var(--say-bg);color:var(--say-line)} .sample.y{background:var(--note-bg);color:var(--note-line)} .sample.r{background:var(--danger-soft);color:var(--danger)}
hr{border:0;border-top:1px solid var(--line);margin:40px 0}
article .ttl{margin:0 0 6px}
article ul.blist{padding-left:22px}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><span>Как пользоваться скриптом<small><span class="zh">«Жемчужина»</span> · бюджет П5 и П6</small></span></div>
  <a class="btn" href="./">Открыть скрипт</a>
</header>

<div class="doc">
<nav class="toc" id="toc" aria-label="Содержание"><p>Содержание</p></nav>

<article id="art"><h2 style="margin-top:0">Как пользоваться скриптом</h2><p class="empty">Загрузка…</p></article>
</div>
<script>
(function(){var v=Date.now();
 function load(src,cb){var x=document.createElement("script");x.src=src+"?v="+v;x.onload=cb;x.onerror=function(){document.getElementById("art").innerHTML="<p>Не удалось загрузить руководство. Обновите страницу.</p>";};document.body.appendChild(x);}
 load("blocks.js",function(){load("data.js",function(){
   var list=(typeof HELP!=="undefined"&&HELP)||[];
   document.getElementById("art").innerHTML='<h2 class="ttl">Как пользоваться скриптом</h2>'+blocksHtml(list,{h:"h3",ids:true});
   var t='<p>Содержание</p>';list.forEach(function(b,i){if(b.h!=null)t+='<a href="#s'+i+'">'+bEsc(b.h)+'</a>';});
   document.getElementById("toc").innerHTML=t;
 });});
})();
</script>
</body>
</html>
